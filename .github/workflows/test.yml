name: NemotronH MLX Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # MLX build can take 10-20 minutes

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-py${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-py${{ matrix.python-version }}-

    - name: Cache MLX wheel
      id: cache-mlx
      uses: actions/cache@v4
      with:
        path: ~/.mlx-wheel
        key: ${{ runner.os }}-mlx-wheel-py${{ matrix.python-version }}-v2
        restore-keys: |
          ${{ runner.os }}-mlx-wheel-py${{ matrix.python-version }}-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libblas-dev liblapack-dev liblapacke-dev libopenblas-dev gfortran

    - name: Build MLX from source
      if: steps.cache-mlx.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.mlx-wheel
        cd /tmp
        git clone --depth 1 https://github.com/ml-explore/mlx.git
        cd mlx
        pip wheel . -w ~/.mlx-wheel

    - name: Install MLX from cached wheel
      run: |
        pip install ~/.mlx-wheel/mlx-*.whl

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install -e .

    - name: Verify MLX installation
      run: |
        python -c "import mlx.core as mx; print(f'MLX version: {mx.__version__}')"

    - name: Run tests (without PyTorch comparison)
      run: |
        pytest tests/test_components.py -v -s --tb=short -m "not requires_torch and not requires_weights"

    - name: Install PyTorch for comparison tests
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Run tests with PyTorch comparison
      run: |
        pytest tests/test_components.py -v -s --tb=short -m "requires_torch and not requires_weights"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install lint dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run ruff
      run: |
        ruff check src/ tests/ --ignore E501,E402
